services:
  stocksearcher:
    build: .
    environment:
      TZ: Asia/Seoul
      OUTPUT_DIR: "/data"
      WEB_PORT: "9999"
      CRON_SCHEDULE_JP: "0 12,18 * * 1-5"
      CRON_SCHEDULE_KR: "0 14,20 * * 1-5"
      JOB_CMD_JP: "python dataset_jp.py && python predict_jp.py --model /models/model_jp.pt --save-db"
      JOB_CMD_KR: "python dataset_kr.py && python predict_kr.py --model /models/model_kr.pt --save-db"
      CRON_LOG_PATH: "/data/log/cron.log"
    volumes:
      - ./config.ini:/app/config.ini:ro
      - /root/stock/models:/models:ro
      - /root/stock/data:/data
    ports:
      - "9999:9999"
    restart: unless-stopped
