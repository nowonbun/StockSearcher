services:
  stocksearcher:
    build: .
    environment:
      TZ: Asia/Seoul
      OUTPUT_DIR: "/data"
      WEB_PORT: "9999"
      CRON_SCHEDULE_JP: "0 12,18 * * 1-5"
      CRON_SCHEDULE_KR: "0 14,20 * * 1-5"
      JOB_CMD_JP: "python dataset_jp.py && python predict_jp_v2.py --model /models/model_jp_v2.pt --save-db && python predict_week_jp_v2.py --model /models/model_week_jp_v2.pt --save-db"
      JOB_CMD_KR: "python dataset_kr.py && python predict_kr_v2.py --model /models/model_kr_v2.pt --save-db && python predict_week_kr_v2.py --model /models/model_week_kr_v2.pt --save-db"
      CRON_LOG_PATH: "/data/log/cron.log"
    volumes:
      - ./config.ini:/app/config.ini:ro
      - /root/stock/models:/models:ro
      - /root/stock/data:/data
    ports:
      - "9999:9999"
    restart: unless-stopped

  stocksearcher-php:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    environment:
      APP_ENV: "production"
      APP_TZ: "Asia/Seoul"
      PYTHON_API_URL: "http://stocksearcher:9999"
      LOG_DIR: "/data/log"
    volumes:
      - ./config.ini:/app/config.ini:ro
      - /root/stock/models:/models:ro
      - /root/stock/data:/data
      - ./webapp/public:/app/webapp/public
      - ./webapp/src:/app/webapp/src
      - ./webapp/templates:/app/webapp/templates
      - ./webapp/templates_c:/app/webapp/templates_c
      - ./webapp/cache:/app/webapp/cache
      - ./webapp/config:/app/webapp/config
    ports:
      - "9998:80"
    restart: unless-stopped
